name: check

# Rebuilds every table from the records and fails if the committed dataset/ differs. No samples, no LLM.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m pytest tools/tests -q
      - run: python tools/common/aggregate.py --check
      - run: python tools/common/aggregate.py
      - run: git diff --exit-code dataset/
